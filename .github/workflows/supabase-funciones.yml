# Sube a Supabase las funciones que mandan los correos (newsletter y admin).
# Se ejecuta sola cuando cambian los archivos de supabase/functions,
# o a mano desde la pestaña Actions → "Subir funciones a Supabase" → Run workflow.
# Requiere en Settings → Secrets and variables → Actions:
#   - Secret   SUPABASE_ACCESS_TOKEN  (Supabase → Account → Access Tokens)
#   - Variable SUPABASE_PROJECT_REF   (el identificador del proyecto: https://ESTE.supabase.co)
name: Subir funciones a Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy newsletter --no-verify-jwt --project-ref "$REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
      - run: supabase functions deploy admin --no-verify-jwt --project-ref "$REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
